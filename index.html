<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D6E6DF">
<title>My Fitness Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Android build. Layout: sticky masthead with a scrolling tab strip, one content column.
   Background is a light-moderate sage so white cards stand out; amber = energy in, teal = energy out.
   This build is light only. */
:root{
  --font-display:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --font-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#D6E6DF; --surface:#FFFFFF; --inset:#F0F6F4;
  --ink:#0D2230; --ink2:#3A5260; --muted:#4A6070;
  --line:#C5D8D0; --line2:#AFC5BC;
  --in:#C97200; --out:#00939E; --bmr:#7CC8CE; --water:#3A86C8;
  --accent:#0B6E78; --on-accent:#FFFFFF;
  --good:#1B7A3B; --good-bg:#DDF0E4; --warn:#8F5A00; --warn-bg:#FBEFD5; --bad:#B3261E; --bad-bg:#FBE3E1;
  color-scheme:light;
}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.mast-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding-top:12px}
.brand{font:700 26px/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.savestate{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:10px 14px 8px;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;font:600 18px/1.2 var(--font-display);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:20px 56px;display:flex;flex-direction:column;gap:16px}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 14px;border:1px solid var(--line2);border-radius:8px;background:var(--inset);color:var(--ink2)}
.banner p{flex:1 1 280px;min-width:0}
.banner b{color:var(--ink)}

/* type */
h2{font:600 30px/1.05 var(--font-display);letter-spacing:.01em;text-wrap:balance}
h3{font:600 20px/1.15 var(--font-display);letter-spacing:.02em;text-wrap:balance}
.lbl{font:600 13px/1.2 var(--font-display);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);max-width:62ch}
.fine{font-size:12px;color:var(--muted)}
.big{font:700 52px/1 var(--font-display);letter-spacing:.01em}
.mid{font:700 34px/1 var(--font-display)}
.u{font:500 15px var(--font-body);color:var(--muted);margin-left:6px}
.lead{max-width:62ch;color:var(--ink2)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:16px}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border:1px solid var(--accent);border-radius:6px;background:var(--accent);color:var(--on-accent);font-weight:600;cursor:pointer;line-height:1.2}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--ink2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 0;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:12px}
.num{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line2);border-radius:6px;background:var(--inset);padding:2px 12px 2px 4px}
.num:focus-within{border-color:var(--accent)}
.num input{flex:1;min-width:0;border:0;background:transparent;padding:8px;font:600 24px/1.2 var(--font-display);outline:0}
.num .u{margin:0}
.txt,select.txt,input.txt{width:100%;border:1px solid var(--line2);border-radius:6px;background:var(--inset);padding:9px 10px;min-width:0}
.txt:focus{outline:0;border-color:var(--accent)}
input[type=date].txt{width:auto}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--inset)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:9px 16px;font-weight:600;color:var(--ink2)}
.seg label+label span{border-left:1px solid var(--line2)}
.seg input:checked+span{background:var(--accent);color:var(--on-accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.datebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.datebar .btn{padding:8px 12px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:var(--inset);border:1px solid var(--line);color:var(--ink2);font-size:12px;font-weight:600;white-space:nowrap}
.chip.good{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.note{padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note.plain{background:var(--inset);color:var(--ink2)}

/* ledger */
.hero-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.hero-row .big{font-size:60px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:76px minmax(0,1fr) 64px;align-items:center;gap:10px}
.bar-row .name{display:flex;align-items:center;gap:8px;font-weight:600}
.bar-row .val{text-align:right;font:600 20px var(--font-display)}
.track{display:flex;gap:2px;height:20px}
.seg-in,.seg-bmr,.seg-act{height:100%;min-width:0}
.seg-in{background:var(--in);border-radius:0 4px 4px 0}
.seg-bmr{background:var(--bmr)}
.seg-act{background:var(--out);border-radius:0 4px 4px 0}
.seg-bmr:last-child{border-radius:0 4px 4px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.dot.in{background:var(--in)}.dot.out{background:var(--out)}.dot.bmr{background:var(--bmr)}
.parts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink2)}
.parts span{display:inline-flex;align-items:center;gap:6px}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter>span{display:block;height:100%;border-radius:5px;background:var(--accent)}
.meter.warn>span{background:var(--in)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pair .mid{margin-top:2px}

/* chart */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font-display);fill:var(--muted);font-size:13px}
.chart .val{fill:var(--ink);font-weight:600;font-size:13px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line2);stroke-width:1}
.chart .bg{fill:var(--inset);opacity:0}
.chart .band:hover .bg,.chart .band:focus .bg{opacity:1}
.chart .band{outline:0}
.chart .in{fill:var(--in)}.chart .out{fill:var(--out)}.chart .bmr{fill:var(--bmr)}
.chart .hit{fill:transparent}
.tableview summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
.tblwrap{overflow-x:auto;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font:600 12px var(--font-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tip{position:fixed;z-index:50;pointer-events:none;max-width:260px;padding:9px 11px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.tip-title{font-weight:600;margin-bottom:4px}
.tip-row{display:flex;align-items:center;gap:8px}
.tip-row b{font:600 15px var(--font-display);min-width:3.2em}
.tip-row i.key{display:inline-block;width:10px;height:3px;border-radius:2px;flex:none}
.tip-row i.in{background:var(--in)}.tip-row i.out{background:var(--out)}.tip-row i.bmr{background:var(--bmr)}

/* scale */
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.scale div{height:10px;background:var(--line2)}
.scale div.on{background:var(--accent)}
.scale-lbl{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;font-size:11px;color:var(--muted);margin-top:4px}
.scale-lbl span.on{color:var(--ink);font-weight:600}

/* meals */
.meal{display:flex;flex-direction:column;gap:12px}
.meal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kc{display:flex;align-items:baseline;gap:4px}
.kc input{width:5.4em;text-align:right;border:1px solid var(--line2);border-radius:6px;background:var(--inset);padding:4px 8px;font:700 22px/1.2 var(--font-display)}
.kc input:focus{outline:0;border-color:var(--accent)}
.meal-body{display:flex;gap:12px;align-items:flex-start}
.thumb{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none;background:var(--inset)}
.meal-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.status{min-height:0;font-size:13px;color:var(--ink2)}
.status.err{color:var(--bad)}
.macro{display:grid;grid-template-columns:78px minmax(0,1fr) 92px;align-items:center;gap:10px;font-size:13px}
.macro .meter{height:8px;background:var(--line)}
.macro .meter>span{background:var(--ink2)}
.macro b{font:600 16px var(--font-display)}
.macro .r{text-align:right;color:var(--ink2)}
.micros{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:6px 18px}
.micro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:13px}
.micro .meter{grid-column:1/-1;height:5px;background:var(--line)}
.micro .meter>span{background:var(--ink2)}
.micro .a{color:var(--ink2)}
.nutri{display:flex;flex-direction:column;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.nutri summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
.items{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
.glasses{display:flex;flex-wrap:wrap;gap:6px}
.glass{border:0;background:none;padding:2px;cursor:pointer;line-height:0}
.glass svg{width:30px;height:42px;display:block}
.glass .cup{fill:none;stroke:var(--line2);stroke-width:1.6}
.glass .wat{fill:var(--water);opacity:0}
.glass.on .wat{opacity:1}
.glass.on .cup{stroke:var(--water)}

/* activity + health */
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wlist li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.wlist li:first-child{border-top:0}
.wlist .sub{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.kv dt{color:var(--ink2)}
.kv dd{margin:0;text-align:right;font:600 18px var(--font-display)}
.kv .total{border-top:1px solid var(--line2);padding-top:8px;font-size:22px}
.tile{display:flex;flex-direction:column;gap:10px}
.tile-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tile-fields{display:flex;gap:8px;align-items:center}
.tile-fields .num{flex:1;min-width:0}
.spark{min-height:44px}
.spark svg{display:block;width:100%;max-width:200px;height:auto;overflow:visible}
.spark .ln{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.spark .hit{fill:transparent}
.spark-empty{font-size:12px;color:var(--muted)}
.src-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;align-items:end}

/* advice */
.opt{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.opt ul{margin:0;padding-left:18px;color:var(--ink2)}
.opt li+li{margin-top:4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px 24px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.empty{padding:28px 8px;text-align:center;color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<div class="mast">
  <div class="wrap">
    <div class="mast-top">
      <h1 class="brand">My Fitness Monitor</h1>
      <span class="savestate" id="savestate" aria-live="polite"></span>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="progress">Progress</button>
      <button class="tab" role="tab" data-tab="profile">Personal info</button>
      <button class="tab" role="tab" data-tab="target">Target</button>
      <button class="tab" role="tab" data-tab="meals">Meals</button>
      <button class="tab" role="tab" data-tab="activity">Activity</button>
      <button class="tab" role="tab" data-tab="health">Health</button>
      <button class="tab" role="tab" data-tab="settings">Settings</button>
    </nav>
  </div>
</div>
<main class="wrap" id="view"><div class="empty">Loading your log…</div></main>
<div class="tip" id="tip" hidden role="tooltip"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileGal" accept="image/*" hidden>
<input type="file" id="fileImp" accept=".csv,.json,text/csv,application/json" hidden>

<script>
(function(){
'use strict';

/* ================= helpers ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return Number.isFinite(n)?n:NaN};
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const nf=(n,d)=>Number.isFinite(n)?n.toLocaleString(undefined,{minimumFractionDigits:d||0,maximumFractionDigits:d||0}):'–';
const signed=n=>(n>0?'+':n<0?'−':'')+nf(Math.abs(n));
const r1=n=>Math.round(n*10)/10;
const clone=o=>JSON.parse(JSON.stringify(o));
const mean=(a,k)=>a.reduce((s,x)=>s+x[k],0)/a.length;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const todayStr=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const shortDate=s=>parseD(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const fullDate=s=>parseD(s).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});

/* ================= constants ================= */
const KCAL_PER_KG=7700, STEP_GOAL=10000, GLASS_ML=250, GLASS_GOAL=8;
const SLOTS=[['breakfast','Breakfast'],['morning','Morning snack'],['brunch','Brunch'],['lunch','Lunch'],['evening','Evening snack'],['dinner','Dinner']];
const SLOT_LABEL=Object.fromEntries(SLOTS);
const MICROS=[['na','Sodium','mg',2300],['k','Potassium','mg',4700],['ca','Calcium','mg',1300],['fe','Iron','mg',18],['mg','Magnesium','mg',420],['zn','Zinc','mg',11],['vitA','Vitamin A','mcg',900],['vitC','Vitamin C','mg',90],['vitD','Vitamin D','mcg',20],['b12','Vitamin B12','mcg',2.4],['fol','Folate','mcg',400]];
const MET={'Walking (brisk)':4.3,'Jogging':7,'Running':9.8,'Cycling':7.5,'Swimming':6,'Yoga':2.8,'Strength training':5,'HIIT / circuit':8,'Dance / Zumba':5.5,'Badminton':5.5,'Cricket':4.8,'Football':7,'Stair climbing':8.8,'Hiking':6,'Skipping rope':11,'Other activity':4};
const INTENSITY={light:.8,moderate:1,vigorous:1.2};
const SOURCES=[
 ['Phone health platforms',['Apple Health','Google Health Connect / Google Fit','Samsung Health']],
 ['Smartwatches and bands',['Apple Watch','Fitbit','Garmin','Samsung Galaxy Watch','Google Pixel Watch','Amazfit / Zepp','Xiaomi Mi Band / Mi Fitness','Huawei Health','Polar','Suunto','Coros','Withings','Noise / NoiseFit','boAt Crest / boAt Wave','Fire-Boltt']],
 ['Rings and recovery trackers',['Oura Ring','Whoop','Ultrahuman Ring']],
 ['Fitness and food apps',['Strava','MyFitnessPal','Nike Run Club','Peloton','Cult.fit','HealthifyMe']],
 ['Other',['Manual entry (no device)']]
];
const DEF_PROFILE={gender:'male',age:30,height:175,weight:80};

/* ================= state + storage ================= */
let S=null;
const ui={tab:'progress',date:todayStr(),meal:{},advice:{busy:false,msg:'',ctl:null},imp:'',chartTable:false};
const pending={};
const AI={sample:null,imagesOK:false};
const store={mode:'memory',col:null,timers:new Map(),chains:new Map()};
const LSP='fitnessMonitor:';
const lsGet=k=>{try{return localStorage.getItem(LSP+k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(LSP+k,v);return true}catch(e){return false}};
const lsDel=k=>{try{localStorage.removeItem(LSP+k)}catch(e){}};
const lsKeys=()=>{try{const o=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(LSP)===0)o.push(k.slice(LSP.length))}return o}catch(e){return[]}};
const withTimeout=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);

function setStatus(kind){
  const el=$('#savestate'); if(!el) return;
  el.textContent={saving:'Saving…',saved:'Saved on this phone','saved-local':'Saved on this phone',memory:'Not saved: storage is blocked',error:'Could not save. Your changes are still on screen.',full:'Storage is full. Delete older days to keep saving.'}[kind]||'';
}
async function initStore(){
  try{localStorage.setItem(LSP+'probe','1');localStorage.removeItem(LSP+'probe');store.mode='local'}catch(e){store.mode='memory'}
}
async function loadAll(){
  const out={settings:null,days:{}};
  try{
    if(store.mode==='db'){
      const snap=await store.col.limit(1000).get();
      snap.docs.forEach(d=>{
        if(!d.exists)return;
        if(d.id==='settings')out.settings=clone(d.data());
        else if(d.id.indexOf('d_')===0)out.days[d.id.slice(2)]=clone(d.data());
      });
    }else if(store.mode==='local'){
      lsKeys().forEach(k=>{
        const raw=lsGet(k); if(!raw)return;
        try{const data=JSON.parse(raw);if(k==='settings')out.settings=data;else if(k.indexOf('d_')===0)out.days[k.slice(2)]=data}catch(e){}
      });
    }
  }catch(e){}
  return out;
}

function queueSave(key){
  setStatus('saving');
  clearTimeout(store.timers.get(key));
  store.timers.set(key,setTimeout(()=>{
    const prev=store.chains.get(key)||Promise.resolve();
    store.chains.set(key,prev.then(()=>writeDoc(key)).catch(()=>{}));
  },600));
}
async function writeDoc(key){
  const data=docFor(key);
  if(store.mode==='memory'){setStatus('memory');return}
  if(data===undefined){
    try{if(store.mode==='db')await store.col.doc(key).delete();else lsDel(key);setStatus(store.mode==='db'?'saved':'saved-local')}catch(e){setStatus('error')}
    return;
  }
  const body=clone(data);
  if(store.mode==='db'){
    for(let tries=0;tries<2;tries++){
      try{await store.col.doc(key).set(body);setStatus('saved');return}
      catch(e){
        if(e&&e.code==='unavailable'&&tries===0){await new Promise(r=>setTimeout(r,800));continue}
        setStatus(e&&e.code==='quota_exceeded'?'full':'error');return;
      }
    }
  }else{
    setStatus(lsSet(key,JSON.stringify(body))?'saved-local':'error');
  }
}

/* ================= AI through the Anthropic API (own key) ================= */
const getKey=()=>lsGet('apikey')||'';
const getModel=()=>lsGet('model')||'claude-sonnet-5-5';
function blobToBase64(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=()=>rej(new Error('read'));fr.readAsDataURL(b)})}
function parseLoose(text){
  const t=String(text||'').trim();
  try{return JSON.parse(t)}catch(e){}
  const f=t.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(f){try{return JSON.parse(f[1])}catch(e){}}
  const a=t.search(/[\[{]/),z=Math.max(t.lastIndexOf('}'),t.lastIndexOf(']'));
  if(a>=0&&z>a){try{return JSON.parse(t.slice(a,z+1))}catch(e){}}
  throw {code:'invalid_json'};
}
async function callClaude(prompt,opts,maxTokens){
  const key=getKey();
  if(!key)throw {code:'no_key'};
  const content=[];
  if(opts&&opts.images){
    const imgs=Array.isArray(opts.images)?opts.images:[opts.images];
    for(const b of imgs)content.push({type:'image',source:{type:'base64',media_type:b.type||'image/jpeg',data:await blobToBase64(b)}});
  }
  content.push({type:'text',text:prompt});
  let res;
  try{
    res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts&&opts.signal,
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:getModel(),max_tokens:maxTokens||2000,messages:[{role:'user',content}]})});
  }catch(e){
    if(e&&e.name==='AbortError')throw {code:'cancelled'};
    throw {code:'offline'};
  }
  if(!res.ok){
    throw {code:res.status===401||res.status===403?'bad_key':res.status===429?'rate_limited':res.status===404?'bad_model':'upstream_error'};
  }
  const data=await res.json();
  const text=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
  if(data.stop_reason==='max_tokens')throw {code:'invalid_json',text};
  return text;
}
function makeShim(){
  const f=async(prompt,opts)=>({text:await callClaude(prompt,opts),truncated:false});
  f.json=async(prompt,opts)=>parseLoose(await callClaude(prompt,opts));
  f.limits=async()=>({images:{maxCount:1,mediaTypes:['image/jpeg','image/png','image/webp']}});
  return f;
}
async function setupAI(){AI.sample=getKey()?makeShim():null;AI.imagesOK=!!AI.sample}

/* ================= calculations ================= */
function profileOK(p){return !!p&&p.age>=18&&p.age<=100&&p.height>=100&&p.height<=230&&p.weight>=30&&p.weight<=300}
function targetOK(){const t=S.settings.target;return !!t&&t.weight>=30&&t.weight<=300&&t.amount>0}
function bmr(p){const b=10*p.weight+6.25*p.height-5*p.age;return p.gender==='male'?b+5:p.gender==='female'?b-161:b-78}
function bmi(p){const m=p.height/100;return p.weight/(m*m)}
function bmiBand(b){return b<18.5?0:b<25?1:b<30?2:3}
const BMI_BANDS=[['Under 18.5','Underweight'],['18.5–24.9','Healthy range'],['25–29.9','Overweight'],['30 and over','Obese']];
function stepKcal(steps,p){const km=(steps||0)*(p.height*0.415/100)/1000;return 0.5*p.weight*km}
function stepKm(steps,p){return (steps||0)*(p.height*0.415/100)/1000}
function workoutKcal(w,p){
  if(w.deviceKcal>0)return w.deviceKcal;
  const met=MET[w.type]||4;
  return Math.max(0,(met-1))*p.weight*((w.minutes||0)/60)*(INTENSITY[w.intensity]||1);
}
const mealKcal=m=>m&&m.kcal>0?Number(m.kcal):0;
function calcDay(date){
  const p=S.settings.profile,d=S.days[date]||{meals:{},workouts:[]};
  const meals=d.meals||{};
  const slotsLogged=SLOTS.filter(s=>mealKcal(meals[s[0]])>0).length;
  const intake=SLOTS.reduce((a,s)=>a+mealKcal(meals[s[0]]),0);
  const steps=Number(d.steps)||0,stepK=stepKcal(steps,p);
  const workK=(d.workouts||[]).reduce((a,w)=>a+workoutKcal(w,p),0);
  const b=bmr(p);
  return {date,intake,slotsLogged,steps,stepK,workK,active:stepK+workK,bmr:b,burn:b+stepK+workK,balance:b+stepK+workK-intake};
}
function basisDays(){
  const t=todayStr(),out=[];
  for(let i=0;i<7;i++){
    const c=calcDay(addDays(t,-i));
    if(i===0?c.slotsLogged>=5:c.slotsLogged>=3)out.push(c);
  }
  return out;
}
function targetInfo(){
  const p=S.settings.profile,t=S.settings.target;
  const days=t.unit==='weeks'?t.amount*7:t.unit==='months'?Math.round(t.amount*30.44):t.amount;
  const deadline=addDays(t.start||todayStr(),Math.round(days||0));
  const today=todayStr(),remaining=diffDays(today,deadline);
  const diff=p.weight-t.weight;
  const dir=Math.abs(diff)<0.05?'hold':diff>0?'lose':'gain';
  const reqPerDay=remaining>0?Math.abs(diff)*KCAL_PER_KG/remaining:Infinity;
  const reqRate=remaining>0?Math.abs(diff)/(remaining/7):Infinity;
  const m=p.height/100;
  const maxRate=dir==='lose'?Math.min(1,0.01*p.weight):0.5;
  const recRate=dir==='lose'?Math.min(0.75,Math.max(0.25,0.0075*p.weight)):0.35;
  return {days,deadline,remaining,diff,dir,reqPerDay,reqRate,minW:18.5*m*m,maxW:24.9*m*m,tgtBmi:t.weight/(m*m),
    floor:p.gender==='male'?1500:p.gender==='female'?1200:1350,maxRate,recRate,
    realisticDays:Math.ceil(Math.abs(diff)/recRate*7),dailyChange:KCAL_PER_KG*recRate/7};
}
function projection(){
  const ti=targetInfo(),b=basisDays();
  let avg=null,n=0,prov=false;
  if(b.length){n=b.length;avg={balance:mean(b,'balance'),intake:mean(b,'intake'),burn:mean(b,'burn'),active:mean(b,'active'),steps:mean(b,'steps'),bmr:b[0].bmr}}
  else{const c=calcDay(todayStr());if(c.intake>0){avg={balance:c.balance,intake:c.intake,burn:c.burn,active:c.active,steps:c.steps,bmr:c.bmr};n=1;prov=true}}
  let status='nodata',eff=null,estDays=null,estDate=null,gap=null;
  if(ti.dir==='hold')status='reached';
  else if(avg){
    eff=ti.dir==='lose'?avg.balance:-avg.balance;
    estDays=eff>20?Math.ceil(Math.abs(ti.diff)*KCAL_PER_KG/eff):null;
    estDate=estDays!=null?addDays(todayStr(),estDays):null;
    gap=isFinite(ti.reqPerDay)?ti.reqPerDay-eff:null;
    if(ti.remaining<=0)status='overdue';
    else if(eff<=20)status='stalled';
    else status=estDays<=ti.remaining?'ontrack':'behind';
  }
  return {ti,avg,n,prov,status,eff,estDays,estDate,gap};
}

function sparkHTML(vals,dec,label,unit){
  const pts=vals.filter(v=>v.v!=null);
  if(!pts.length)return '<span class="spark-empty">No readings in the last 7 days</span>';
  const W=180,H=44,px=8,py=8;
  let mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v));
  if(mx-mn<1e-9){mn-=1;mx+=1}
  const X=i=>px+i*(W-2*px)/6,Y=v=>py+(1-(v-mn)/(mx-mn))*(H-2*py);
  let path='',run=[];
  const flush=()=>{if(run.length>1)path+='<polyline class="ln" points="'+run.join(' ')+'"/>';run=[]};
  let hits='',last=null;
  vals.forEach((p,i)=>{
    if(p.v==null){flush();return}
    run.push(X(i).toFixed(1)+','+Y(p.v).toFixed(1));last=i;
    hits+='<circle class="hit" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="11" data-tip="'+tipAttr({title:shortDate(p.date),rows:[{label:label,value:nf(p.v,dec)+' '+unit}]})+'"/>';
  });
  flush();
  const end='<circle class="end" cx="'+X(last).toFixed(1)+'" cy="'+Y(vals[last].v).toFixed(1)+'" r="4.5"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label+', last 7 days')+'">'+path+end+hits+'</svg>';
}

function dayNutrition(d){
  const t={kcal:0,p:0,c:0,f:0,fib:0,sug:0,micros:{},ai:0,n:0};
  SLOTS.forEach(s=>{
    const m=d&&d.meals&&d.meals[s[0]];
    if(!m||!(m.kcal>0))return;
    t.n++;t.kcal+=m.kcal;
    if(m.ai){t.ai++;t.p+=m.p||0;t.c+=m.c||0;t.f+=m.f||0;t.fib+=m.fib||0;t.sug+=m.sug||0;MICROS.forEach(x=>{t.micros[x[0]]=(t.micros[x[0]]||0)+((m.micros&&m.micros[x[0]])||0)})}
  });
  return t;
}
function macroHTML(t){
  const rows=[['Protein',t.p,4],['Carbs',t.c,4],['Fat',t.f,9]];
  const tot=rows.reduce((a,r)=>a+r[1]*r[2],0)||1;
  return rows.map(r=>{const k=r[1]*r[2],pc=Math.round(k/tot*100);return '<div class="macro"><span>'+r[0]+'</span><div class="meter" role="img" aria-label="'+r[0]+' '+pc+' percent of macro calories"><span style="width:'+pc+'%"></span></div><span class="r"><b>'+nf(r[1],1)+' g</b> · '+pc+'%</span></div>'}).join('')+
    '<p class="fine">Fibre '+nf(t.fib,1)+' g · Sugar '+nf(t.sug,1)+' g</p>';
}
function microHTML(m){
  return '<div class="micros">'+MICROS.map(x=>{const v=m[x[0]]||0,pc=Math.round(v/x[3]*100);return '<div class="micro"><span>'+x[1]+'</span><span class="a">'+nf(v,v<10?1:0)+' '+x[2]+' · '+pc+'%</span><div class="meter" role="img" aria-label="'+x[1]+' '+pc+' percent of daily value"><span style="width:'+clamp(pc,0,100)+'%"></span></div></div>'}).join('')+'</div><p class="fine">Percent of a typical adult daily value.</p>';

function summaryHTML(){

/* --- images --- */
async function prepImage(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch(e){
    bmp=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{res(im)};im.onerror=()=>rej(new Error('decode'));im.src=u});
  }
  const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight;
  const make=(max,q)=>new Promise((res,rej)=>{
    const s=Math.min(1,max/Math.max(w0,h0)),c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(w0*s));c.height=Math.max(1,Math.round(h0*s));
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',q);
  });
  const big=await make(1024,.82),small=await make(176,.6);
  const thumb=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(new Error('read'));fr.readAsDataURL(small)});
  return {big,thumb};
}
function dataUrlToBlob(u){
  const p=u.split(','),mime=(p[0].match(/:(.*?);/)||[])[1]||'image/jpeg',bin=atob(p[1]),a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:mime});
}
async function onPhoto(file,slot){
  if(!file)return;
  const date=ui.date;
  try{
    const r=await prepImage(file);
    pending[slot]=r.big;
    const d=touch(date);const m=d.meals[slot]||(d.meals[slot]={});m.thumb=r.thumb;
    ui.meal[slot]={};refreshMeal(slot);
    analyzeMeal(slot,date);
  }catch(e){ui.meal[slot]={msg:"That photo could not be read. Try a JPEG or PNG."};refreshMeal(slot)}
}
function aiErrorText(e){
  const c=e&&e.code;
  return {no_key:'Add your Anthropic API key in Settings to use AI estimates.',bad_key:'Anthropic rejected the API key. Check it in Settings.',bad_model:'That model name was not found. Check it in Settings.',offline:'No internet connection. Try again when you are online.',not_granted:'Claude access was declined for this page, so AI estimates are off.',sampling_disabled:'AI estimates are not available for this account.',rate_limited:'Too many requests right now. Wait a minute and try again.',image_rejected:'That photo could not be used. Try a different JPEG or PNG.',images_unavailable:'Photo analysis is not available here. Describe the meal instead.',invalid_json:'The answer came back garbled. Try again.',refused:'Claude could not estimate this one. Try a clearer photo or a description.',empty_completion:'No answer came back. Try again.',session_expired:'Please sign in again to use AI estimates.',prompt_too_large:'That was too much to send. Try again.'}[c]||'Something went wrong while contacting the AI. Try again.';
}
function aiOffHTML(){return '<p class="note plain">AI estimates are off until you add an Anthropic API key. You can still type calories for each meal. <button class="btn link" data-act="tab" data-tab="settings">Open settings</button></p>'}
function mealPrompt(slot,desc,hasImage){
  const list=MICROS.map(m=>m[0]+' = '+m[1]+' in '+m[2]).join(', ');
  const shape=MICROS.map(m=>'"'+m[0]+'":0').join(',');
  return 'You are a nutrition estimator inside a fitness tracking app.\n'+
   'Meal slot: '+SLOT_LABEL[slot]+'.\n'+
   (hasImage?'A photo of the meal is attached. Estimate what is on the plate or in the bowl.\n':'No photo is attached. Estimate from the description.\n')+
   (desc?'The person describes it as: "'+desc.replace(/"/g,"'").slice(0,300)+'"\n':'There is no written description.\n')+
   'Estimate the whole serving shown or described, using realistic portion sizes. Indian, South Asian and other regional dishes are common, so name them correctly.\n'+
   'Reply with only one JSON object in exactly this shape:\n'+
   '{"dish":"short name","items":[{"name":"...","portion":"e.g. 1 cup (150 g)","kcal":0}],"kcal":0,"protein_g":0,"carbs_g":0,"fat_g":0,"fiber_g":0,"sugar_g":0,"micros":{'+shape+'},"confidence":"low or medium or high","notes":"one short sentence naming the main assumption"}\n'+
   'Micronutrient keys: '+list+'.\n'+
   'Every value is a single number, never a range. Item calories should add up to the total within 5 percent, and 4 kcal per gram of protein and carbohydrate plus 9 kcal per gram of fat should be within 15 percent of the total.\n'+
   'If the picture shows no food and there is no description, reply with {"error":"no_food"} instead.';
}
function cleanMeal(r){
  if(!r||typeof r!=='object'||Array.isArray(r))throw {code:'invalid_json'};
  if(r.error)return {error:String(r.error)};
  const n=(v,max)=>{const x=Number(v);return Number.isFinite(x)&&x>=0?Math.min(x,max):0};
  const items=(Array.isArray(r.items)?r.items:[]).slice(0,12).map(i=>({n:String((i&&i.name)||'').slice(0,60),q:String((i&&i.portion)||'').slice(0,40),k:Math.round(n(i&&i.kcal,3000))})).filter(i=>i.n);
  let kcal=Math.round(n(r.kcal,5000));if(!kcal)kcal=items.reduce((a,i)=>a+i.k,0);
  if(!kcal)return {error:'no_food'};
  const micros={};MICROS.forEach(m=>{micros[m[0]]=r1(n(r.micros&&r.micros[m[0]],1e6))});
  return {dish:String(r.dish||'').slice(0,60),items,kcal,p:r1(n(r.protein_g,500)),c:r1(n(r.carbs_g,800)),f:r1(n(r.fat_g,400)),fib:r1(n(r.fiber_g,150)),sug:r1(n(r.sugar_g,400)),micros,conf:['low','medium','high'].indexOf(r.confidence)>=0?r.confidence:'medium',notes:String(r.notes||'').slice(0,220)};
}
async function analyzeMeal(slot,dateArg){
  const date=dateArg||ui.date,d=getDay(date,true),m=d.meals[slot]||(d.meals[slot]={});
  const desc=(m.desc||'').trim();
  const blob=pending[slot]||(m.thumb?dataUrlToBlob(m.thumb):null);
  const show=()=>{if(ui.date===date)refreshMeal(slot)};
  if(!AI.sample){ui.meal[slot]={msg:aiErrorText({code:'no_key'})};show();return}
  if(!blob&&!desc){ui.meal[slot]={msg:'Add a photo or describe the meal first.'};show();return}
  const useImg=!!blob&&AI.imagesOK;
  if(!useImg&&!desc){ui.meal[slot]={msg:aiErrorText({code:'images_unavailable'})};show();return}
  const ctl=new AbortController();
  ui.meal[slot]={busy:true,ctl};show();
  try{
    const opts={signal:ctl.signal,modelTier:'default'};
    if(useImg)opts.images=blob;
    const raw=await AI.sample.json(mealPrompt(slot,desc,useImg),opts);
    const r=cleanMeal(raw);
    if(r.error){ui.meal[slot]={msg:'No food was found. Try a clearer photo or describe the meal.'}}
    else{
      const dd=touch(date);const mm=dd.meals[slot]||(dd.meals[slot]={});
      Object.assign(mm,r,{ai:true,at:new Date().toISOString()});
      ui.meal[slot]={};
    }
  }catch(e){ui.meal[slot]=(e&&e.code==='cancelled')?{}:{msg:aiErrorText(e)}}
  show();
}

function recentMealsText(){
  const t=todayStr(),seen={},out=[];
  for(let i=0;i<7&&out.length<14;i++){
    const d=S.days[addDays(t,-i)];if(!d)continue;
    SLOTS.forEach(s=>{const m=d.meals&&d.meals[s[0]];if(!m||!(m.kcal>0))return;const nm=(m.dish||m.desc||'unnamed meal');const key=s[1]+nm;if(seen[key]||out.length>=14)return;seen[key]=1;out.push('- '+s[1]+': '+nm+' ('+Math.round(m.kcal)+' kcal)')});
  }
  return out.join('\n')||'- (no meals described)';
}
function recentWorkoutsText(){
  const t=todayStr(),agg={};
  for(let i=0;i<7;i++){const d=S.days[addDays(t,-i)];(d&&d.workouts||[]).forEach(w=>{agg[w.type]=(agg[w.type]||0)+(w.minutes||0)})}

function cleanAdvice(r){
  if(!r||typeof r!=='object'||!Array.isArray(r.options))throw {code:'invalid_json'};
  const opts=r.options.slice(0,4).map(o=>({title:String(o&&o.title||'').slice(0,80),kind:['activity','meals','both'].indexOf(o&&o.kind)>=0?o.kind:'both',kcal:Number.isFinite(Number(o&&o.kcalPerDay))?Math.round(Number(o.kcalPerDay)):0,how:(Array.isArray(o&&o.how)?o.how:[]).slice(0,5).map(x=>String(x).slice(0,220))})).filter(o=>o.title&&o.how.length);
  if(!opts.length)throw {code:'invalid_json'};
  return {headline:String(r.headline||'').slice(0,140),verdict:['on_track','behind','unrealistic'].indexOf(r.verdict)>=0?r.verdict:'behind',options:opts,dateAdvice:r.dateAdvice&&r.dateAdvice!=='null'?String(r.dateAdvice).slice(0,400):'',caution:r.caution&&r.caution!=='null'?String(r.caution).slice(0,400):''};
}

async function getAdvice(){
  const pr=projection();
  if(!AI.sample||!pr.avg)return;
  const ctl=new AbortController();
  ui.advice={busy:true,msg:'',ctl};
  const paint=()=>{const el=$('#advice-body');if(el&&ui.tab==='progress')el.innerHTML=adviceHTML(projection())};
  paint();
  try{
    const raw=await AI.sample.json(advicePrompt(pr),{signal:ctl.signal,modelTier:'default',cache:{gcTime:300000,refresh:true}});
    const r=cleanAdvice(raw);
    r.at=new Date().toISOString();r.n=pr.n;
    S.settings.advice=r;queueSave('settings');
    ui.advice={busy:false,msg:''};
  }catch(e){ui.advice={busy:false,msg:(e&&e.code==='cancelled')?'':aiErrorText(e)}}
  paint();
}

   '<section class="card"><h3>Privacy</h3><p class="lead">Your profile, meals, activity and health readings stay in this app on your phone. The key is kept in the app\u2019s private storage. When you analyze a meal, the photo and your description go straight from your phone to Anthropic. Nothing passes through any other server.</p><p class="hint">Create a key in the Claude Console. The Claude docs at docs.claude.com explain how.</p></section></div>';
}
window.__androidBack=function(){if(ui.tab!=='progress'){setTab('progress');return true}return false};

/* ================= import ================= */
function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}
    else cur+=ch;
  }
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);
  if(rows.length<2)return [];
  const head=rows[0].map(h=>h.trim().toLowerCase().replace(/[\s-]+/g,'_'));
  return rows.slice(1).map(r=>{const o={};head.forEach((h,i)=>{o[h]=(r[i]||'').trim()});return o});
}
function normDate(v){
  v=String(v||'').trim();let m;
  if((m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  if((m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/)))return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return '';
}
async function importFile(file){
  const src=S.settings.source;
  try{
    const text=await file.text();let rows;
    const tr=text.trim();
    if(tr[0]==='['||tr[0]==='{'){const j=JSON.parse(tr);rows=(Array.isArray(j)?j:(j.days||j.data||[j])).map(o=>{const x={};Object.keys(o).forEach(k=>{x[k.toLowerCase().replace(/[\s-]+/g,'_')]=o[k]});return x})}
    else rows=parseCSV(text);
    const pick=(o,names)=>{for(const n of names){if(o[n]!==undefined&&o[n]!==''&&o[n]!==null){const v=Number(o[n]);if(Number.isFinite(v))return v}}return null};
    let count=0;const today=todayStr();
    rows.forEach(o=>{
      const ds=normDate(o.date||o.day);if(!ds||ds>today)return;
      const d=getDay(ds,true);d.sample=false;let any=false;
      const steps=pick(o,['steps','step_count']);if(steps!=null){d.steps=Math.round(steps);d.src.activity=src;any=true}
      d.workouts=d.workouts.filter(w=>!w.imported);
      const mins=pick(o,['minutes','workout_minutes','duration_min']),cal=pick(o,['calories','calories_burned','active_calories']);
      const name=String(o.workout||o.workout_type||o.activity||'').trim();
      if((mins&&mins>0)||(cal&&cal>0)){
        const type=Object.keys(MET).find(k=>k.toLowerCase()===name.toLowerCase())||(name?Object.keys(MET).find(k=>k.toLowerCase().indexOf(name.toLowerCase())===0)||'Other activity':'Other activity');
        d.workouts.push({id:'im'+ds+Math.random().toString(36).slice(2,6),type,minutes:mins||0,intensity:'moderate',deviceKcal:cal>0?Math.round(cal):0,imported:true});d.src.activity=src;any=true;
      }
      [['sleep',['sleep_hours','sleep']],['stress',['stress']],['rhr',['resting_hr','resting_heart_rate']],['ahr',['avg_hr','heart_rate','average_heart_rate']],['spo2',['spo2']],['hrv',['hrv']],['sys',['systolic']],['dia',['diastolic']]].forEach(x=>{const v=pick(o,x[1]);if(v!=null){d.health[x[0]]=v;d.src.health=src;any=true}});
      if(any){count++;queueSave('d_'+ds)}
    });
    ui.imp=count?'Imported '+count+' day'+(count===1?'':'s')+' from '+file.name+'.':'No usable rows found. Check that the file has a date column.';
  }catch(e){ui.imp='That file could not be read. Use a CSV or a JSON list.'}
  render(true);
}

/* ================= actions ================= */
const ACT={
  tab:b=>setTab(b.dataset.tab),
  dayPrev:()=>{ui.date=addDays(ui.date,-1);render(true)},
  dayNext:()=>{if(ui.date<todayStr()){ui.date=addDays(ui.date,1);render(true)}},
  dayToday:()=>{ui.date=todayStr();render(true)},
  clearSample:()=>{
    Object.keys(S.days).forEach(k=>{if(S.days[k].sample){delete S.days[k];queueSave('d_'+k)}});
    S.settings.advice=null;queueSave('settings');render(true);
  },
  cam:b=>{const s=b.closest('[data-slot]').dataset.slot;$('#fileCam').dataset.slot=s;$('#fileCam').value='';$('#fileCam').click()},
  gal:b=>{const s=b.closest('[data-slot]').dataset.slot;$('#fileGal').dataset.slot=s;$('#fileGal').value='';$('#fileGal').click()},
  analyze:b=>analyzeMeal(b.closest('[data-slot]').dataset.slot),
  stopMeal:b=>{const s=b.closest('[data-slot]').dataset.slot,st=ui.meal[s];if(st&&st.ctl)st.ctl.abort()},
  clearMeal:b=>{
    const s=b.closest('[data-slot]').dataset.slot,d=getDay(ui.date);
    if(d){delete d.meals[s];touch(ui.date)}
    delete pending[s];ui.meal[s]={};refreshMeal(s);
  },
  water:b=>{const d=touch(ui.date),n=+b.dataset.n;d.water=(d.water===n)?n-1:n;const el=$('#water');if(el)el.innerHTML=waterHTML()},
  waterStep:b=>{const d=touch(ui.date);d.water=clamp((d.water||0)+(+b.dataset.d),0,30);const el=$('#water');if(el)el.innerHTML=waterHTML()},
  addWorkout:()=>{
    const mins=num($('#woMin').value),kc=num($('#woKcal').value);
    if(!(mins>0)&&!(kc>0)){$('#woMin').focus();return}
    const d=touch(ui.date);
    d.workouts.push({id:'w'+Date.now().toString(36),type:$('#woType').value,minutes:mins>0?mins:0,intensity:$('#woInt').value,deviceKcal:kc>0?Math.round(kc):0});
    $('#woMin').value='';$('#woKcal').value='';
    $('#wlist').innerHTML=workoutListHTML();$('#act-out').innerHTML=actOutHTML();
  },
  delWorkout:b=>{
    const d=touch(ui.date);d.workouts=d.workouts.filter(w=>w.id!==b.dataset.id);
    $('#wlist').innerHTML=workoutListHTML();$('#act-out').innerHTML=actOutHTML();
  },
  import:()=>{if(!S.settings.source)return;$('#fileImp').value='';$('#fileImp').click()},
  advice:()=>getAdvice(),
  stopAdvice:()=>{if(ui.advice.ctl)ui.advice.ctl.abort()},
  saveKey:async()=>{
    const k=($('#apiKey').value||'').trim(),m=($('#apiModel').value||'').trim()||'claude-sonnet-5-5',msg=$('#aiMsg');
    if(k&&k.indexOf('sk-ant-')!==0){msg.className='status err';msg.textContent='That does not look like an Anthropic key. It should start with sk-ant-.';return}
    lsSet('model',m);if(k)lsSet('apikey',k);
    await setupAI();render(true);
    const m2=$('#aiMsg');if(m2)m2.textContent=k?'Saved. AI estimates are on.':'Model saved.';
  },
  removeKey:async()=>{lsDel('apikey');await setupAI();render(true);const m=$('#aiMsg');if(m)m.textContent='Key removed.'},
  testKey:async()=>{
    const msg=$('#aiMsg');msg.className='status';msg.innerHTML='<span class="spin"></span>Checking…';
    try{await callClaude('Reply with the single word OK.',{},16);msg.textContent='Connected. Your key works.'}
    catch(e){msg.className='status err';msg.textContent=aiErrorText(e)}
  }
};
const INPUT={
  prof:t=>{const v=num(t.value);S.settings.profile[t.dataset.k]=Number.isFinite(v)?v:null;S.settings.mine=true;S.settings.advice=null;queueSave('settings');const o=$('#prof-out');if(o)o.innerHTML=profOutHTML()},
  tgt:t=>{const v=num(t.value);S.settings.target[t.dataset.k]=Number.isFinite(v)?v:null;S.settings.mine=true;S.settings.advice=null;queueSave('settings');const o=$('#tgt-out');if(o)o.innerHTML=tgtOutHTML()},
  kcal:t=>{
    const slot=t.closest('[data-slot]').dataset.slot,v=num(t.value),d=touch(ui.date),m=d.meals[slot]||(d.meals[slot]={});
    if(Number.isFinite(v)&&v>0)m.kcal=Math.round(v);else delete m.kcal;
    const s=$('#meals-sum');if(s)s.innerHTML=summaryHTML();
  },
  desc:t=>{const slot=t.closest('[data-slot]').dataset.slot,d=touch(ui.date),m=d.meals[slot]||(d.meals[slot]={});m.desc=t.value},
  steps:t=>{const v=num(t.value),d=touch(ui.date);d.steps=Number.isFinite(v)&&v>=0?Math.round(v):null;const o=$('#act-out');if(o)o.innerHTML=actOutHTML()},
  health:t=>{
    const d=touch(ui.date),v=num(t.value);
    if(Number.isFinite(v))d.health[t.dataset.k]=v;else delete d.health[t.dataset.k];
    updateTile(t.dataset.tile);
  }
};
const CHANGE={
  gender:t=>{S.settings.profile.gender=t.value;S.settings.mine=true;S.settings.advice=null;queueSave('settings');const o=$('#prof-out');if(o)o.innerHTML=profOutHTML()},
  tgtunit:t=>{S.settings.target.unit=t.value;S.settings.mine=true;S.settings.advice=null;queueSave('settings');const o=$('#tgt-out');if(o)o.innerHTML=tgtOutHTML()},
  tgtstart:t=>{if(t.value){S.settings.target.start=t.value;S.settings.mine=true;S.settings.advice=null;queueSave('settings');const o=$('#tgt-out');if(o)o.innerHTML=tgtOutHTML()}},
  date:t=>{if(t.value&&t.value<=todayStr()){ui.date=t.value;render(true)}},
  source:t=>{S.settings.source=t.value;queueSave('settings');const el=$('#srcpanel');if(el)el.outerHTML=sourcePanelHTML()},
  tab:()=>{}
};
const view=$('#view');
view.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b,e)});
view.addEventListener('input',e=>{const t=e.target,f=t.dataset&&t.dataset.in&&INPUT[t.dataset.in];if(f)f(t,e)});
view.addEventListener('change',e=>{const t=e.target,f=t.dataset&&t.dataset.ch&&CHANGE[t.dataset.ch];if(f)f(t,e)});
$('#fileCam').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)onPhoto(f,e.target.dataset.slot)});
$('#fileGal').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)onPhoto(f,e.target.dataset.slot)});
$('#fileImp').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)importFile(f)});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)setTab(b.dataset.tab)});
document.addEventListener('toggle',e=>{if(e.target.id==='tbl')ui.chartTable=e.target.open},true);

/* ================= routing ================= */
const VIEWS={progress:viewProgress,profile:viewProfile,target:viewTarget,meals:viewMeals,activity:viewActivity,health:viewHealth,settings:viewSettings};
function setTab(t){
  if(!VIEWS[t])return;
  ui.tab=t;
  try{history.replaceState(null,'','#'+t)}catch(e){try{location.hash=t}catch(e2){}}
  render(false);window.scrollTo(0,0);
}
function render(keep){
  $$('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===ui.tab)));
  const y=window.scrollY;
  try{view.innerHTML=banner()+VIEWS[ui.tab]()}
  catch(e){view.innerHTML='<section class="card"><h2>Something went wrong</h2><p class="lead">This tab could not be drawn. Try another tab and come back.</p></section>';if(window.console)console.error(e)}
  hideTip();
  if(keep)window.scrollTo(0,y);
}

/* ================= boot ================= */
async function boot(){
  try{const h=(location.hash||'').replace('#','');if(VIEWS[h])ui.tab=h}catch(e){}
  await initStore();
  const loaded=await loadAll();
  const fresh=!loaded.settings&&!Object.keys(loaded.days).length;
  const def=defaultSettings();
  S={settings:Object.assign({},def,loaded.settings||{}),days:loaded.days};
  S.settings.profile=Object.assign({},def.profile,S.settings.profile||{});
  S.settings.target=Object.assign({},def.target,S.settings.target||{});
  if(fresh){
    S.days=seedSample();
    queueSave('settings');Object.keys(S.days).forEach(k=>queueSave('d_'+k));
  }
  setStatus(store.mode==='memory'?'memory':'');
  await setupAI();
  render(false);
}
boot();
})();
